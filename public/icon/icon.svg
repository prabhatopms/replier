<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FCAF45"/>
      <stop offset="28%"  stop-color="#F77737"/>
      <stop offset="52%"  stop-color="#FD1D1D"/>
      <stop offset="76%"  stop-color="#E1306C"/>
      <stop offset="100%" stop-color="#833AB4"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#F77737"/>
      <stop offset="100%" stop-color="#C13584"/>
    </linearGradient>
  </defs>

  <!-- App icon background: Instagram-style rounded square -->
  <rect width="128" height="128" rx="26" ry="26" fill="url(#bg)"/>

  <!-- Subtle inner glow ring (depth) -->
  <rect x="1" y="1" width="126" height="126" rx="25.5" ry="25.5"
        fill="none" stroke="white" stroke-width="1.5" opacity="0.18"/>

  <!--
    Speech bubble — flat bottom-centre tail
    Body: x 22..106, y 20..82  (rounded corners r=10)
    Tail: centred at x=64, pointing down to y=100
  -->
  <path d="
    M 32 20
    L 96 20
    Q 106 20 106 30
    L 106 74
    Q 106 84  96 84
    L 74 84
    L 64 100
    L 54 84
    L 32 84
    Q 22 84  22 74
    L 22 30
    Q 22 20  32 20
    Z
  " fill="white" opacity="0.97"/>

  <!-- Three typing dots — signal "AI generating a reply" -->
  <circle cx="46" cy="52" r="7.5" fill="url(#dot)"/>
  <circle cx="64" cy="52" r="7.5" fill="url(#dot)"/>
  <circle cx="82" cy="52" r="7.5" fill="url(#dot)"/>
</svg>
