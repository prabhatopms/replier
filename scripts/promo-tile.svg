<svg width="440" height="280" viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e1a"/>
      <stop offset="100%" stop-color="#14101f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="bubbleAI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="440" height="280" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <circle cx="380" cy="30" r="110" fill="#7c3aed" opacity="0.07"/>
  <circle cx="50" cy="260" r="90" fill="#db2777" opacity="0.06"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="440" height="3" fill="url(#accent)"/>

  <!-- ─── Left: Chat preview ─── -->
  <!-- Contact bubble -->
  <rect x="32" y="68" width="148" height="36" rx="18" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="106" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="rgba(255,255,255,0.55)" text-anchor="middle">hey, what are you up to? 👀</text>

  <!-- AI reply bubble -->
  <rect x="52" y="118" width="148" height="36" rx="18" fill="url(#bubbleAI)" opacity="0.92"/>
  <text x="126" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="white" text-anchor="middle">not much, you tell me 😏</text>

  <!-- AI badge under bubble -->
  <rect x="52" y="164" width="72" height="20" rx="10" fill="rgba(139,92,246,0.22)" stroke="rgba(139,92,246,0.4)" stroke-width="1"/>
  <text x="88" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#c4b5fd" text-anchor="middle" font-weight="600">✦ AI drafted</text>

  <!-- Tone pills row -->
  <rect x="32" y="200" width="44" height="19" rx="9.5" fill="rgba(236,72,153,0.18)" stroke="rgba(236,72,153,0.35)" stroke-width="1"/>
  <text x="54" y="213.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#f9a8d4" text-anchor="middle" font-weight="500">Flirty</text>

  <rect x="82" y="200" width="48" height="19" rx="9.5" fill="rgba(139,92,246,0.18)" stroke="rgba(139,92,246,0.35)" stroke-width="1"/>
  <text x="106" y="213.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#c4b5fd" text-anchor="middle" font-weight="500">Smooth</text>

  <rect x="136" y="200" width="44" height="19" rx="9.5" fill="rgba(99,102,241,0.18)" stroke="rgba(99,102,241,0.35)" stroke-width="1"/>
  <text x="158" y="213.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#a5b4fc" text-anchor="middle" font-weight="500">Funny</text>

  <!-- Divider -->
  <line x1="212" y1="50" x2="212" y2="234" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- ─── Right: Branding ─── -->
  <!-- App name -->
  <text x="326" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-1">Insta</text>
  <text x="326" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="800" fill="url(#accent)" text-anchor="middle" letter-spacing="-1">Replier</text>

  <!-- Tagline -->
  <text x="326" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="rgba(255,255,255,0.4)" text-anchor="middle">AI replies for your Instagram DMs</text>

  <!-- Provider pills -->
  <rect x="236" y="205" width="52" height="18" rx="9" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="262" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">Claude</text>

  <rect x="294" y="205" width="52" height="18" rx="9" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="320" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">Gemini</text>

  <rect x="352" y="205" width="52" height="18" rx="9" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="378" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">OpenAI</text>

  <!-- Bottom tagline -->
  <text x="220" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="rgba(255,255,255,0.18)" text-anchor="middle">Your key · Your data · Your device</text>
</svg>
